name: cran

# The check as CRAN actually runs it, which is not what r.yml runs.
#
# r-lib/actions/check-r-package sets _R_CHECK_CRAN_INCOMING_=false, so the
# checks that only CRAN performs never happen there: the URL check, the DOI
# check, and incoming feasibility. That is a sensible default for a per-commit
# gate and a bad one for a package being prepared for CRAN, because the first
# time those run would then be the submission itself.
#
# It also runs weekly, because the links and DOIs it checks can break with no
# change here. A dead link or DOI comes out as a note, and the last step fails
# the job on any warning or note it does not know, so a weekly run finds one
# before CRAN's own checks do.
#
# What it cannot find is a service that has moved or changed. An example that
# calls a service returns an envelope instead of raising, which is what CRAN
# wants, so a dead endpoint prints NULL and the check still passes.
# tests/testthat/test-live.R is what checks the services, and no workflow runs
# it.
#
# This one stays on pull requests into main. The other workflows now run on
# every pull request, but this is the one that runs the \donttest{} examples,
# so each run makes 56 real requests to services we do not own. Running that on
# every push to a branch would be a lot of traffic for them, and it would not
# tell us anything r.yml has not already told us.
on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC. Nothing depends on the exact time.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cran:
    runs-on: ubuntu-latest
    name: cran
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The whole reason this job exists.
      _R_CHECK_CRAN_INCOMING_: true
      _R_CHECK_CRAN_INCOMING_REMOTE_: true
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: pkg-r

      # error_on = "error", not the usual "warning": between releases this check
      # always warns that the version is not newer than the one on CRAN, and a
      # job that is red for a known reason stops being read. The next step reads
      # every warning and note instead, and fails on anything it does not know.
      - name: Check as CRAN
        id: check
        run: |
          res <- rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran", "--run-donttest"),
            build_args = "--no-manual",
            error_on = "error",
            check_dir = "check"
          )
          print(res)
        shell: Rscript {0}
        working-directory: pkg-r

      # The known list, and the reason for each entry, is in the script.
      - name: Fail on any warning or note not on the known list
        run: Rscript .github/scripts/cran-messages.R pkg-r/check/bioclients.Rcheck/00check.log

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cran-check-results
          path: pkg-r/check
          retention-days: 14
