name: pkgdown

on:
  push:
    branches: [main, dev]
    paths: ["pkg-r/**", ".github/workflows/pkgdown.yml"]
  pull_request:
    paths: ["pkg-r/**", ".github/workflows/pkgdown.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build only. Publishing the site to Pages waits until the repo goes public,
  # the same way biohttp holds its site back until r-universe.
  build:
    runs-on: ubuntu-latest
    name: build
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          working-directory: pkg-r

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
        working-directory: pkg-r

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: pkg-r/_site
          if-no-files-found: error
