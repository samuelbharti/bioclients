name: pkgdown

# Only a pull request into main, and the push to main when it merges. Nothing on
# a feature branch or a pull request into dev runs here at all; build the site
# locally with `pkgdown::build_site("pkg-r", preview = FALSE)` while working.
#
# The `paths:` filters that used to narrow this to pkg-r/** are gone on purpose.
# They would skip the job on a docs-only pull request, and a required check that
# never reports blocks the pull request instead of passing it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two deploys must never overlap, but a release already under way should finish
# rather than be cancelled halfway. Only a pull request build is disposable.
concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build only. Publishing the site to Pages waits until the repo goes public,
  # the same way biohttp holds its site back until r-universe.
  build:
    runs-on: ubuntu-latest
    name: build
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          working-directory: pkg-r

      # dest_dir is passed explicitly because build_site_github_pages() defaults
      # it to "docs" and that default WINS over the `destination: _site` in
      # _pkgdown.yml. Without it the site is written to pkg-r/docs, the upload
      # below finds nothing at pkg-r/_site, and the job fails on an empty
      # artifact rather than on anything to do with the site.
      - name: Build pkgdown site
        run: >
          pkgdown::build_site_github_pages(
            dest_dir = "_site", new_process = FALSE, install = FALSE
          )
        shell: Rscript {0}
        working-directory: pkg-r

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: pkg-r/_site
          if-no-files-found: error
