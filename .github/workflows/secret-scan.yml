name: secret-scan

# Runs on every pull request, whatever it targets. gitleaks also runs locally
# on every commit through prek, so a secret is caught before it reaches a branch
# at all. This scans the full history again, on anything heading anywhere.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
