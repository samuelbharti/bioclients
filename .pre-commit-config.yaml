# prek / pre-commit hooks for bioclients.
# Verify locally with `prek run --all-files`.
# Install the git hooks once with:
#   prek install --install-hooks
#   prek install --hook-type commit-msg
default_install_hook_types: [pre-commit, commit-msg]

# Stored API responses are recordings, not source. They are copied byte for byte
# out of the app they came from and a test asserts they still match, so a hook
# that "tidies" one (a trailing newline, a line ending) breaks the recording and
# the guarantee that a ported parser reads exactly what the app read.
exclude: ^pkg-r/tests/testthat/fixtures/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, dev]

  # Secret scanning. This runs on every commit rather than only in CI, because
  # a secret that reaches a branch has already been written to disk and to the
  # reflog. Catching it here means it never becomes a commit at all.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # R formatting (Posit air). The hook is a Python wheel that bundles the air
  # binary, so it needs no separate toolchain.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.10.0
    hooks:
      - id: air-format

  # Enforce Conventional Commit messages.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
