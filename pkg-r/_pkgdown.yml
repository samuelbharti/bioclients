url: https://www.samuelbharti.com/bioclients/

# pkgdown defaults to docs/, which would collide with the package's own docs
# directory, so the generated site gets its own.
destination: _site

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#1a6b54"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Bricolage Grotesque"}
    code_font: {google: "JetBrains Mono"}
    border-radius: "0.25rem"

home:
  title: bioclients
  description: >
    One client per biological database, each with a pure parser that runs
    offline.

navbar:
  structure:
    left: [reference, news]
    right: [github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/samuelbharti/bioclients

reference:
  - title: MyGene
    desc: Gene identity and annotation.
    contents:
      - mygene_gene
      - mygene_genes
      - mygene_parse_hits
      - mygene_parse_batch
      - mygene_pick_hit

  - title: gnomAD
    desc: >
      Population frequency and gene constraint, as separate entry points. One
      function cannot serve both.
    contents:
      - gnomad_constraint
      - gnomad_constraints
      - gnomad_frequency
      - gnomad_parse_constraint
      - gnomad_parse_constraints
      - gnomad_parse_frequency
      - gnomad_parse_populations

  - title: ClinVar
    desc: Clinical significance, via NCBI E-utilities.
    contents:
      - clinvar_classification
      - clinvar_parse_record
      - clinvar_category
      - clinvar_conditions

  - title: Open Targets
    desc: >
      Gene and disease association, both directions, plus the disease resolver
      that existed twice in the family.
    contents:
      - opentargets_gene_diseases
      - opentargets_disease_targets
      - opentargets_resolve_disease
      - opentargets_parse_diseases
      - opentargets_parse_targets
      - opentargets_parse_matches
      - opentargets_is_id

  - title: DGIdb
    desc: >
      Curated drug-gene interaction counts. An unknown gene is NA, a known gene
      with none is 0.
    contents:
      - dgidb_gene
      - dgidb_genes
      - dgidb_parse_genes

  - title: Pharos
    desc: >
      Target Development Level. The classification only; turning it into a
      weight is the caller's job.
    contents:
      - pharos_target
      - pharos_targets
      - pharos_parse_targets

  - title: CIViC
    desc: Expert-curated cancer variant evidence counts.
    contents:
      - civic_gene
      - civic_parse_gene

  - title: Package
    contents:
      - bioclients-package
